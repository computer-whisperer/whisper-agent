name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Be loud about warnings — `cargo clippy -- -D warnings` covers the lints
  # but a plain `cargo build` won't. CI surfaces both.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned to the same minor as `ARG RUST_VERSION` in the Dockerfile
      # (and `[workspace.package].rust-version`), so CI verifies the
      # toolchain that builds the production image. `@stable` kept
      # breaking here: each release adds clippy lints and `-D warnings`
      # turns them into failures (red from 2026-08-09 to 2026-09-08).
      # Bump all three together.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Prebuilt binary straight from the upstream release, pinned to the
      # same version as `ARG WASM_PACK_VERSION` in the Dockerfile (bump
      # both together). This replaced jetli/wasm-pack-action, which
      # resolved `latest` to 0.9.1 (2021) mid-day on 2026-05-07 and later
      # sat on the Node 20 runtime that GitHub deprecated in 2025-09.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: 0.13.1
        run: |
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin \
                "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"
          wasm-pack --version

      # `src/server.rs` embeds `crates/whisper-agent-damascene-ui/pkg/` via
      # `rust-embed`; the macro checks the folder exists at compile time.
      # `pkg/` is wasm-pack output and gitignored — we have to build it
      # here before clippy/test touch the host-side workspace. Debug
      # build is fine: CI only needs the files to exist so the embed
      # macro resolves; size and speed matter more than optimization.
      # (Was `whisper-agent-webui` until the egui frontend was dropped
      # in `chore: drop egui webui + desktop crates`; mirrors the path
      # `scripts/dev.sh` and the Dockerfile now use.)
      - name: Build damascene-ui (wasm-pack)
        run: wasm-pack build crates/whisper-agent-damascene-ui --target web

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked
