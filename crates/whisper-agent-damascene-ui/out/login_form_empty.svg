<text data-node="root.card.0.group.2.group.0.button[login:connect]" data-shader="stock::text" x="957.33" y="381.09" font-family="Inter Variable" font-size="14.00" font-weight="600" fill="#ffffff" text-anchor="middle">Connect</text>
</svg>
