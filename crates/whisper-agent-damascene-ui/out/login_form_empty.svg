<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
    <feOffset dx="0" dy="2"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow-md" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
    <feOffset dx="0" dy="6"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
    <feOffset dx="0" dy="12"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#09090b"/>
<rect data-node="root.card.0" data-shader="stock::rounded_rect" x="580.00" y="24.00" width="440.00" height="392.00" rx="12.00" fill="#18191b" stroke="rgba(54,58,63,0.824)" stroke-width="1.00" filter="url(#shadow-sm)" />
<text data-node="root.card.0.group.0.heading.0" data-shader="stock::text" x="604.00" y="61.82" font-family="Inter Variable" font-size="16.00" font-weight="600" fill="#edeef0" text-anchor="start">whisper-agent</text>
<text data-node="root.card.0.group.0.text.1" data-shader="stock::text" x="604.00" y="87.09" font-family="Inter Variable" font-size="14.00" font-weight="400" fill="#b0b4ba" text-anchor="start">Sign in to a whisper-agent server</text>
<text data-node="root.card.0.group.1.group.0.group.0.text.0" data-shader="stock::text" x="606.00" y="131.09" font-family="Inter Variable" font-size="14.00" font-weight="500" fill="#edeef0" text-anchor="start">Server URL</text>
<rect data-node="root.card.0.group.1.group.0.group.0.form_control.1.text_input[login:server]" data-shader="stock::rounded_rect" x="606.00" y="144.00" width="388.00" height="32.00" rx="6.00" fill="#1e1f22" stroke="rgba(54,58,63,0.745)" stroke-width="1.00" />
<text data-node="root.card.0.group.1.group.0.group.0.text.2" data-shader="stock::text" x="606.00" y="199.09" font-family="Inter Variable" font-size="14.00" font-weight="400" fill="#b0b4ba" text-anchor="start">e.g. https://host:port — http://127.0.0.1:8080 for loopback</text>
<text data-node="root.card.0.group.1.group.0.group.1.text.0" data-shader="stock::text" x="606.00" y="231.09" font-family="Inter Variable" font-size="14.00" font-weight="500" fill="#edeef0" text-anchor="start">Client token</text>
<rect data-node="root.card.0.group.1.group.0.group.1.form_control.1.text_input[login:token]" data-shader="stock::rounded_rect" x="606.00" y="244.00" width="388.00" height="32.00" rx="6.00" fill="#1e1f22" stroke="rgba(54,58,63,0.745)" stroke-width="1.00" />
<text data-node="root.card.0.group.1.group.0.group.1.text.2" data-shader="stock::text" x="606.00" y="299.09" font-family="Inter Variable" font-size="14.00" font-weight="400" fill="#b0b4ba" text-anchor="start">blank is OK for loopback servers</text>
<rect data-node="root.card.0.group.1.group.0.group.2.form_control.0.group.0.checkbox[login:remember]" data-shader="stock::rounded_rect" x="606.00" y="318.00" width="16.00" height="16.00" rx="4.00" fill="#0090ff" stroke="#0090ff" stroke-width="1.00" />
