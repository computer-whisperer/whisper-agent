<text data-node="root.card.0.group.1.group.0.group.2.form_control.0.group.0.text.1" data-shader="stock::text" x="630.00" y="331.09" font-family="Inter Variable" font-size="14.00" font-weight="400" fill="#edeef0" text-anchor="start">Remember on this device</text>
